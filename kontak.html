<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desa Segedong - Hubungi Kami</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{ --bg:#f5f8fc; --card:#ffffff; --text:#172033; --muted:#64748b; --primary:#2563eb; --primary2:#1d4ed8; --accent:#06b6d4; --border:#e2e8f0; --shadow:0 12px 35px rgba(15,23,42,.10); }
.dark{ --bg:#0b1220; --card:#111c2e; --text:#f8fafc; --muted:#a8b3c7; --border:#263449; --shadow:0 12px 35px rgba(0,0,0,.35); }
*{ box-sizing:border-box; margin:0; padding:0; font-family:'Poppins',sans-serif; scroll-behavior:smooth; }
body{ background:var(--bg); color:var(--text); line-height:1.65; }
nav{ position:sticky; top:0; z-index:1000; background:rgba(15,40,100,.96); backdrop-filter:blur(12px); padding:12px 5%; display:flex; align-items:center; justify-content:space-between; box-shadow:var(--shadow); }
.logo{ color:white; font-weight:800; font-size:1.3rem; }
.logo i{ margin-right:8px; }
nav ul{ display:flex; gap:8px; align-items:center; list-style:none; flex-wrap:wrap; justify-content:flex-end; }
nav a, .nav-btn{ border:0; background:transparent; color:white; text-decoration:none; padding:8px 11px; border-radius:99px; cursor:pointer; font-weight:500; }
nav a:hover, nav a.active, .nav-btn:hover{ background:rgba(255,255,255,.16); }
section{ max-width:1200px; margin:auto; padding:65px 5%; }
.title{ text-align:center; color:var(--primary); font-size:2.1rem; margin-bottom:35px; }
.contact{ display:flex; justify-content:center; }
.box{ background:var(--card); padding:25px; border-radius:18px; box-shadow:var(--shadow); width:100%; max-width:600px; }
input, textarea{ width:100%; padding:13px; margin-bottom:12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); }
.actions{ display:flex; flex-wrap:wrap; gap:8px; margin-top:15px; }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:12px; padding:12px 20px; text-decoration:none; cursor:pointer; font-weight:600; transition:.25s; }
.primary{ background:var(--primary); color:white; }
.secondary{ background:var(--card); color:var(--text); }
.toast{ position:fixed; left:50%; bottom:25px; transform:translateX(-50%) translateY(100px); background:#111827; color:white; padding:12px 20px; border-radius:30px; z-index:3000; transition:.3s; }
.toast.show{ transform:translateX(-50%) translateY(0); }
footer{ background:#0f172a; color:white; text-align:center; padding:35px 20px; margin-top:30px; }
</style>
</head>
<body>

<nav>
<div class="logo"><i class="fa-solid fa-tree"></i> Segedong</div>
<ul>
<li><a href="index.html"><i class="fa-solid fa-house"></i> Beranda</a></li>
<li><a href="wisata.html"><i class="fa-solid fa-mountain-sun"></i> Wisata & UMKM</a></li>
<li><a href="layanan.html"><i class="fa-solid fa-hand-holding-heart"></i> Layanan</a></li>
<li><a href="galeri.html"><i class="fa-solid fa-images"></i> Galeri</a></li>
<li><a href="kontak.html" class="active"><i class="fa-solid fa-phone"></i> Kontak</a></li>
<li><button class="nav-btn" onclick="toggleTheme()" title="Mode Gelap/Terang"><i class="fa-solid fa-moon"></i></button></li>
</ul>
</nav>

<section id="kontak">
<h2 class="title">Hubungi Kami</h2>
<div class="contact">
<div class="box">
<form onsubmit="sendMessage(event)">
<input id="nama" placeholder="Nama Lengkap" required>
<input id="email" type="email" placeholder="Email Anda" required>
<textarea id="pesan" rows="5" placeholder="Tuliskan pesan atau pertanyaan..." required></textarea>
<button class="btn primary" style="width:100%" type="submit"><i class="fa-solid fa-paper-plane"></i> Kirim Pesan</button>
</form>
<div class="actions" style="margin-top:15px; justify-content:center;">
<button class="btn secondary" onclick="copyContact()"><i class="fa-solid fa-copy"></i> Salin Kontak</button>
</div>
</div>
</div>
</section>

<footer>
<p>© 2026 Desa Segedong Sempadung. Dibuat untuk memajukan potensi desa.</p>
</footer>

<div class="toast" id="toast"></div>

<script>
function toast(message){
    let t = document.getElementById('toast');
    t.textContent = message;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
}

function toggleTheme(){
    document.body.classList.toggle('dark');
    let mode = document.body.classList.contains('dark') ? 'dark' : 'light';
    localStorage.setItem('theme', mode);
    toast(mode === 'dark' ? '🌙 Mode gelap aktif' : '☀️ Mode terang aktif');
}
if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');

function sendMessage(event){
    event.preventDefault();
    let nama = document.getElementById('nama').value;
    toast(`✅ Terima kasih ${nama}, pesan Anda telah terkirim!`);
    event.target.reset();
}

function copyContact(){
    navigator.clipboard.writeText('Desa Segedong Sempadung, Kec. Tebas, Kab. Sambas');
    toast('📋 Kontak berhasil disalin!');
}
</script>
</body>
</html>
